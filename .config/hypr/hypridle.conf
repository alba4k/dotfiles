# HYPRIDLE - alba4k
#
# Documentation: https://wiki.hyprland.org/Hypr-Ecosystem/hypridle

general {
    lock_cmd = pidof -q hyprlock || hyprlock -q
    unlock_cmd = killall -q -SIGUSR1 hyprlock
    on_unlock_cmd = hyprctl dispatch "hl.dsp.dpms({action = 'on'})" & hyprctl dispatch "hl.dsp.force_idle(0)"
    before_sleep_cmd = playerctl -a pause & openrgb -d 0 -m direct -c 000000 -d 1 -m direct -c 000000; pidof -q hyprlock || hyprlock -q --no-fade-in --immediate-render # turn ram rgb off
    after_sleep_cmd = openrgb -d 0 -m direct -c 001010 -d 1 -m direct -c 001010 -d 2 -m direct -c 001010 & hyprctl dispatch "hl.dsp.dpms({action = 'on'})" & hyprctl hyprsunset reset gamma
    inhibit_sleep = 1
}

listener {
    timeout = 30
    on-timeout = hyprctl hyprsunset gamma 50
    on-resume = hyprctl hyprsunset reset gamma
    condition_cmd = "! pidof -q hyprlock"
}

listener {
    timeout = 30
    on-timeout = hyprctl dispatch "hl.dsp.dpms({action = 'off'})"
    on-resume = hyprctl dispatch "hl.dsp.dpms({action = 'on'})"
    condition_cmd = "pidof -q hyprlock"
}

listener {
    timeout = 90
    on-timeout = loginctl lock-session
}

listener {
    timeout = 120
    on-timeout = hyprctl dispatch "hl.dsp.dpms({action = 'off'})"
    on-resume = hyprctl dispatch "hl.dsp.dpms({action = 'on'})"
}

listener {
    timeout = 300
    on-timeout = systemctl suspend-then-hibernate
}

